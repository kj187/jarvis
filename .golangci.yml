version: "2"

# Formatting was unchecked until struct-alignment drift had accumulated across
# seven files: golangci-lint is the only Go gate in CI and the pre-commit hook,
# and it does not check formatting unless the formatter is enabled here.
formatters:
  enable:
    - gofmt

linters:
  enable:
    - gosec
    - errcheck
    - bodyclose
    - noctx
    - staticcheck
    - govet
    - misspell
    - dupl
  settings:
    gosec:
      severity: medium
      confidence: medium
    dupl:
      threshold: 100
  exclusions:
    rules:
      - path: "_test.go"
        linters:
          - gosec
          - errcheck
      - path: "internal/history/store.go"
        linters:
          - gosec
        text: "G202"
      - path: "internal/history/store_retention.go"
        linters:
          - gosec
        text: "G202"
