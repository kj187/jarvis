style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/kj187/jarvis
options:
  # Stable tags only: a release candidate (vX.Y.Z-rc.N) must never become the
  # previous tag of the real vX.Y.Z, or its changelog section renders empty.
  tag_filter_pattern: "^v\\d+\\.\\d+\\.\\d+$"
  commits:
    filters:
      Type:
        - feat
        - fix
        - security
        - perf
        - refactor
        - docs
        - test
        - chore
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      security: Security
      perf: Performance Improvements
      refactor: Code Refactoring
      docs: Documentation
      test: Tests
      chore: Chores
  header:
    pattern: "^(\\w*)(?:\\(([\\w\\$\\.\\-\\*\\s]*)\\))?!?\\:?\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
