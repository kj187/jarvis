{{- $needDsn := not .Values.database.existingSecret -}}
{{- $needAuth := and (ne .Values.auth.provider "none") (not .Values.auth.existingSecret) .Values.auth.secretKey -}}
{{- $needOidc := and (eq .Values.auth.provider "oidc") (not .Values.auth.existingSecret) .Values.auth.oidc.clientSecret -}}
{{- if or $needDsn $needAuth $needOidc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jarvis.fullname" . }}
  labels:
    {{- include "jarvis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needDsn }}
  dsn: {{ .Values.database.dsn | quote }}
  {{- end }}
  {{- if $needAuth }}
  secret-key: {{ .Values.auth.secretKey | quote }}
  {{- end }}
  {{- if $needOidc }}
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
