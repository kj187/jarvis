{{- $needDsn := not .Values.database.existingSecret -}}
{{- $needAuth := and (ne .Values.auth.provider "none") (not .Values.auth.existingSecret) .Values.auth.secretKey -}}
{{- $needOidc := and (eq .Values.auth.provider "oidc") (not .Values.auth.existingSecret) .Values.auth.oidc.clientSecret -}}
{{- $clusterSecrets := list -}}
{{- range $i, $cluster := .Values.clusters -}}
{{- $n := add $i 1 -}}
{{- $auth := $cluster.auth | default dict -}}
{{- if not $auth.existingSecret -}}
{{-   if $auth.bearerToken -}}
{{-     $clusterSecrets = append $clusterSecrets (dict "key" (printf "cluster-%d-bearer-token" $n) "value" $auth.bearerToken) -}}
{{-   end -}}
{{-   $basicAuth := $auth.basicAuth | default dict -}}
{{-   if $basicAuth.password -}}
{{-     $clusterSecrets = append $clusterSecrets (dict "key" (printf "cluster-%d-basic-auth-password" $n) "value" $basicAuth.password) -}}
{{-   end -}}
{{-   $oauth2 := $auth.oauth2 | default dict -}}
{{-   if $oauth2.clientSecret -}}
{{-     $clusterSecrets = append $clusterSecrets (dict "key" (printf "cluster-%d-oauth2-client-secret" $n) "value" $oauth2.clientSecret) -}}
{{-   end -}}
{{- end -}}
{{- end -}}
{{- if or $needDsn $needAuth $needOidc $clusterSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jarvis.fullname" . }}
  labels:
    {{- include "jarvis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needDsn }}
  dsn: {{ .Values.database.dsn | quote }}
  {{- end }}
  {{- if $needAuth }}
  secret-key: {{ .Values.auth.secretKey | quote }}
  {{- end }}
  {{- if $needOidc }}
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- range $clusterSecrets }}
  {{ .key }}: {{ .value | quote }}
  {{- end }}
{{- end }}
