suite: secret
templates:
  - templates/secret.yaml

tests:
  - it: creates Secret when no existingSecret configured
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: stores DSN value in secret
    set:
      database.dsn: /data/jarvis.db
    asserts:
      - equal:
          path: stringData.dsn
          value: /data/jarvis.db

  - it: stores PostgreSQL DSN in secret
    set:
      database.dsn: postgres://jarvis:secret@postgres:5432/jarvis?sslmode=disable
    asserts:
      - equal:
          path: stringData.dsn
          value: postgres://jarvis:secret@postgres:5432/jarvis?sslmode=disable

  - it: does not create Secret when existingSecret is set and auth is none
    set:
      database.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: still creates Secret for the auth key when database.existingSecret is set
    set:
      database.existingSecret: my-db-secret
      auth.provider: internal
      auth.secretKey: "deadbeefdeadbeefdeadbeefdeadbeef"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.secret-key
          value: deadbeefdeadbeefdeadbeefdeadbeef
      - notExists:
          path: stringData.dsn

  - it: omits dsn when database.existingSecret is set even with oidc auth
    set:
      database.existingSecret: my-db-secret
      auth.provider: oidc
      auth.secretKey: "deadbeefdeadbeefdeadbeefdeadbeef"
      auth.oidc.clientSecret: "my-oidc-secret"
    asserts:
      - notExists:
          path: stringData.dsn
      - equal:
          path: stringData.oidc-client-secret
          value: my-oidc-secret

  - it: creates no Secret at all when both database and auth use existingSecret
    set:
      database.existingSecret: my-db-secret
      auth.provider: internal
      auth.existingSecret: jarvis-auth
    asserts:
      - hasDocuments:
          count: 0

  - it: stores secret-key when auth.provider is internal and auth.secretKey is set
    set:
      auth.provider: internal
      auth.secretKey: "deadbeefdeadbeefdeadbeefdeadbeef"
    asserts:
      - equal:
          path: stringData.secret-key
          value: deadbeefdeadbeefdeadbeefdeadbeef

  - it: omits secret-key when auth.provider is none
    asserts:
      - notExists:
          path: stringData.secret-key

  - it: stores oidc-client-secret when provider is oidc and clientSecret is set
    set:
      auth.provider: oidc
      auth.secretKey: "deadbeefdeadbeefdeadbeefdeadbeef"
      auth.oidc.clientSecret: "my-oidc-secret"
    asserts:
      - equal:
          path: stringData.oidc-client-secret
          value: my-oidc-secret

  - it: omits oidc-client-secret when auth.existingSecret is set
    set:
      auth.provider: oidc
      auth.existingSecret: jarvis-auth
      auth.oidc.clientSecret: "my-oidc-secret"
    asserts:
      - notExists:
          path: stringData.oidc-client-secret

  - it: stores per-cluster auth secrets under cluster-N-* keys
    values:
      - ./values/cluster-auth.yaml
    asserts:
      - equal:
          path: stringData.cluster-1-bearer-token
          value: my-bearer-token
      - equal:
          path: stringData.cluster-1-basic-auth-password
          value: my-basic-password
      - equal:
          path: stringData.cluster-1-oauth2-client-secret
          value: my-oauth2-secret

  - it: omits per-cluster auth secrets when no cluster sets auth
    asserts:
      - notExists:
          path: stringData.cluster-1-bearer-token

  - it: omits per-cluster auth secrets when that cluster uses its own existingSecret
    values:
      - ./values/cluster-auth-existing-secret.yaml
    asserts:
      - notExists:
          path: stringData.cluster-1-bearer-token
