name: Secret Scan (full history)

on:
  schedule:
    - cron: '15 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    name: Full History
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks canary
        run: CONTAINER_CMD=docker scripts/check-gitleaks-canary.sh
      - name: Run gitleaks over the full history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # ratchet:gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
