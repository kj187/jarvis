name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pin-check:
    name: Action Pin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Install ratchet
        run: |
          go install github.com/sethvargo/ratchet@v0.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify all Actions are SHA-pinned
        run: ratchet check .github/workflows/*.yml

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --format='%h %s' \
            --invert-grep --grep='^Signed-off-by: ' "${BASE_SHA}..${HEAD_SHA}")
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by trailer (use 'git commit -s'):"
            echo "$missing"
            exit 1
          fi

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Fails when .gitleaks.toml stops detecting synthetic secrets (a config without rules reports "no leaks found").
      - name: Gitleaks canary
        run: CONTAINER_CMD=docker scripts/check-gitleaks-canary.sh
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # ratchet:gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3

  agent-context:
    name: Agent Context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      # Agent context guards: adapters thin, skills valid, AGENTS.md size,
      # path refs, fixtures match, invariants — see scripts/check-agent-context.sh.
      - name: Check agent context
        run: scripts/check-agent-context.sh
      # Release body logic (curated RC notes, notes refresh) lives in a script so it is testable.
      - name: Test release body script
        run: scripts/test-release-body.sh
      # SBOM merge and completeness check (fixtures, no network) — see scripts/sbom.sh.
      - name: Test SBOM script
        run: scripts/test-sbom.sh
      # Every FROM carries a @sha256 digest and pnpm is installed pinned — see scripts/check-image-pins.sh.
      - name: Check image pins
        run: |
          scripts/test-check-image-pins.sh
          scripts/check-image-pins.sh
      # Generated colour tokens (app, docs site, video) must match design/tokens.json.
      - name: Check design tokens
        run: node scripts/design-tokens.mjs --check
      # No raw Tailwind palette classes / colour literals / radii in frontend code: semantic tokens only.
      - name: Check palette classes
        run: node scripts/check-design-drift.mjs

  # Backend is split into three jobs on separate runners so the PostgreSQL-backed
  # tests never share a runner with the fuzz targets (fuzz workers oversubscribe
  # a shared runner; .agents/lessons/testing-and-e2e.md). The aggregator below
  # keeps the required status check "Backend" of the `protect-main` ruleset.
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: index.docker.io/library/postgres@sha256:4ffc96598f8965ee5b33b4186ab4f1ca4df7f4f0325f06d17c19d18e51d3f107 # ratchet:postgres:17
        env:
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      # go.mod/go.sum live in backend/, not the repo root: without an explicit
      # path setup-go finds no dependency file and silently restores no cache.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run tests
        env:
          JARVIS_TEST_POSTGRES_DSN: postgres://jarvis:jarvis@localhost:5432/jarvis?sslmode=disable
        run: |
          set -o pipefail
          go test -v -race -coverprofile=coverage.out ./... 2>&1 | go-junit-report -set-exit-code > report.xml

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "## Backend Coverage"
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # ratchet:dorny/test-reporter@v3
        if: always()
        with:
          name: Backend Test Results
          path: backend/report.xml
          reporter: java-junit

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/report.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  backend-lint:
    name: Backend Lint and Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ratchet:golangci/golangci-lint-action@v9.3.0
        with:
          working-directory: backend
          version: v2.13.2

  backend-fuzz:
    name: Backend Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum

      - name: Run fuzz targets (short)
        # -parallel=2 caps the fuzzing worker processes per target: the default
        # (GOMAXPROCS) oversubscribes a shared CI runner enough that the
        # coordinator<->worker RPC misses its internal deadline and the run
        # fails with "context deadline exceeded" — not a real finding.
        # The targets run one after another on purpose (never in parallel).
        run: |
          go test ./internal/db -run '^$' -fuzz '^FuzzRedactDSN$' -fuzztime 20s -parallel 2
          go test ./internal/history -run '^$' -fuzz '^FuzzParseNullableTimeString$' -fuzztime 20s -parallel 2
          go test ./internal/config -run '^$' -fuzz '^FuzzParseSecretKey$' -fuzztime 20s -parallel 2
          go test ./internal/api -run '^$' -fuzz '^FuzzValidateSilenceMatchers$' -fuzztime 20s -parallel 2
          go test ./internal/api -run '^$' -fuzz '^FuzzSanitizeAMMessage$' -fuzztime 20s -parallel 2

  # Aggregator: keeps the required check name "Backend". `if: always()` makes it
  # run (and fail) when a part failed or was cancelled; a skipped or missing
  # part would otherwise leave the check "Expected" or pass it silently.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, backend-fuzz]
    if: always()
    permissions: {}
    steps:
      - name: Require all backend jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "backend job results: ${RESULTS}"
          [ -n "${RESULTS}" ] || { echo "::error::no backend job results"; exit 1; }
          for r in ${RESULTS}; do
            [ "$r" = "success" ] || { echo "::error::a backend job did not succeed (${r})"; exit 1; }
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Unit tests (lib/alertUtils.ts, with coverage gate)
        run: pnpm test:unit:coverage

      - name: Build
        run: pnpm build

      - name: Check code duplication
        run: pnpm duplication

  helm:
    name: Helm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Chart changes must update charts/jarvis/CHANGELOG.md; every version
      # section and every release-notes file states its breaking changes
      # (.agents/skills/release/SKILL.md). Same script as the pre-commit hook.
      - name: Check changelogs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE_SHA" "$HEAD_SHA" | scripts/check-changelogs.sh

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # ratchet:azure/setup-helm@v5.0.1
        with:
          version: v3.21.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2

      - name: Lint chart
        run: helm lint charts/jarvis/

      - name: Run unit tests
        run: helm unittest charts/jarvis/

  # Scans the image CI builds from ./Containerfile (HIGH/CRITICAL findings that
  # have a fix fail the job) and every Containerfile/chart/compose file for
  # misconfigurations. A new finding in the Debian base can turn this red
  # without a code change: bump the base image (Dependabot) or, for a finding
  # with no fix, add a reasoned entry to .trivyignore.yaml.
  # The Trivy version is pinned below and bumped by hand together with the action.
  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Build image
        run: docker build -f Containerfile -t jarvis:scan .

      - name: Scan image (HIGH and CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # ratchet:aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: jarvis:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Containerfiles, chart and compose files (misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # ratchet:aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      # Scanner self-test: the same settings against a deliberately outdated
      # image must fail with findings. A scanner that silently finds nothing
      # (stale database, wrong flags) would otherwise pass every build.
      - name: Scanner self-test (alpine:3.10 must be flagged)
        id: selftest
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # ratchet:aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: alpine:3.10
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: selftest.json

      - name: Require the self-test to fail with findings
        run: |
          if [ "${{ steps.selftest.outcome }}" != "failure" ]; then
            echo "::error::trivy did not fail on alpine:3.10, so the image gate would not catch anything"
            exit 1
          fi
          jq -e '[.Results[]?.Vulnerabilities[]?] | length > 0' selftest.json >/dev/null \
            || { echo "::error::the self-test failed without reporting vulnerabilities (scanner error, not a finding)"; exit 1; }

  # Release SBOM dry run: the same scripts/sbom.sh build the release workflow
  # uses, against the image built from this PR. Fails when the SBOM misses the
  # frontend packages (react), a Go module or a base package, or when 10 % or
  # more of the packages have no license, so the release cannot first discover it.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Build image
        run: docker build -f Containerfile -t jarvis:sbom .

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # ratchet:anchore/sbom-action/download-syft@v0.24.3

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Build and check SBOM
        run: |
          SYFT="${{ steps.syft.outputs.cmd }}"
          if [ -z "${SYFT}" ]; then SYFT=$(command -v syft); fi
          mkdir -p "${RUNNER_TEMP}/bin"
          ln -sf "${SYFT}" "${RUNNER_TEMP}/bin/syft"
          PATH="${RUNNER_TEMP}/bin:${PATH}" scripts/sbom.sh build docker:jarvis:sbom sbom.spdx.json ci
