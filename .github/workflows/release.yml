name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Job order: image (build, sign, attest) → Helm chart (published only after
# the image exists, stable releases only) → GitHub Release (SBOM + signature
# bundle, release body). A failure in an earlier job stops the later ones, so
# neither a chart nor a release ever points at an image that wasn't built.

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # required for keyless cosign signing via GitHub OIDC
      attestations: write # required for build provenance and SBOM attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/kj187/jarvis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # ratchet:sigstore/cosign-installer@v4.1.2

      - name: Sign image with keyless signing (GitHub OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/kj187/jarvis@${{ steps.build.outputs.digest }}

      # Publishes SLSA provenance to the GitHub attestations API so consumers
      # can run `gh attestation verify` (in addition to the BuildKit provenance
      # already embedded in the image manifest).
      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/kj187/jarvis
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Pre-releases don't publish a chart: Chart.yaml still carries the previous
  # stable chart version (already published) — the release body tells RC
  # testers to override image.tag instead.
  chart:
    name: Helm Chart
    needs: build-and-push
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless cosign signing via GitHub OIDC
    uses: ./.github/workflows/chart-release.yml
    with:
      require_image: true

  release:
    name: GitHub Release
    needs: [build-and-push, chart]
    # chart is skipped for pre-releases — still release then, but never after
    # a failed/cancelled image or chart job.
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' && (needs.chart.result == 'success' || needs.chart.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: read # syft pulls the image
      id-token: write # keyless cosign signing of the SBOM

    steps:
      # fetch-depth: 0 (full history + tags) so the pre-release notes step
      # below can diff against the last stable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standalone SPDX SBOM attached to the GitHub Release as an asset, so
      # users can inspect dependencies without pulling the image. syft is run
      # directly because the sbom-action wrapper no longer supports writing to
      # a workspace file (output-file/upload-* inputs were removed).
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # ratchet:anchore/sbom-action/download-syft@v0.24.2

      - name: Generate SBOM (SPDX)
        run: |
          SYFT="${{ steps.syft.outputs.cmd }}"
          if [ -z "${SYFT}" ]; then SYFT=$(command -v syft); fi
          "${SYFT}" "ghcr.io/kj187/jarvis@${{ needs.build-and-push.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json
          test -s sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # ratchet:sigstore/cosign-installer@v4.1.2

      # Signed release asset: the sigstore bundle lets consumers verify the SBOM
      # with `cosign verify-blob`, and is what OpenSSF Scorecard's
      # Signed-Releases check looks for (*.sigstore.json) on release assets.
      - name: Sign SBOM (keyless, GitHub OIDC)
        run: cosign sign-blob --yes --bundle sbom.spdx.json.sigstore.json sbom.spdx.json

      - name: Build release body
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST="${{ needs.build-and-push.outputs.digest }}"
          CHART_VERSION=$(awk '/^version:/{print $2}' charts/jarvis/Chart.yaml)

          # Pre-releases (tag contains a hyphen, e.g. v1.7.0-rc.1) never get
          # curated notes or a CHANGELOG section — those are only generated
          # for real releases, so an RC leaves no trace in either once the
          # real release follows. Summarize commits since the last stable
          # tag instead.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PREV_STABLE=$(git tag --list 'v*' | grep -Ev -- '-' | sort -V | tail -1)
            {
              printf '## Pre-release build\n\n'
              printf 'Release candidate for the upcoming stable release. Not published as `latest`.\n\n'
              if [ -n "${PREV_STABLE}" ]; then
                printf '**Commits since %s:**\n\n' "${PREV_STABLE}"
                git log "${PREV_STABLE}..${GITHUB_REF_NAME}" --pretty='- %s (%h)'
              fi
            } > release-body.md
          else
            # Curated release notes are mandatory for stable releases (they
            # carry the explicit Breaking Changes section) — fail instead of
            # silently falling back to the generated CHANGELOG section.
            NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
            if [ ! -f "${NOTES_FILE}" ]; then
              echo "::error::${NOTES_FILE} is missing — every stable release needs curated notes (.agents/skills/release/SKILL.md)."
              exit 1
            fi
            cp "${NOTES_FILE}" release-body.md
          fi

          cat >> release-body.md <<'EOF'

          ---

          ## Container image

          ```shell
          docker pull ghcr.io/kj187/jarvis:@VERSION@
          ```

          Digest: `@DIGEST@`

          ### Verify image signature (cosign)

          ```shell
          cosign verify ghcr.io/kj187/jarvis@@DIGEST@ \
            --certificate-identity-regexp="https://github.com/kj187/jarvis/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          ```

          ### Verify build provenance (GitHub attestation)

          ```shell
          gh attestation verify oci://ghcr.io/kj187/jarvis:@VERSION@ --repo kj187/jarvis
          ```
          EOF

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            cat >> release-body.md <<'EOF'

          ## Helm chart

          Release candidates don't publish a chart. To test this RC on Kubernetes, install the current chart with the RC image:

          ```shell
          helm install jarvis oci://ghcr.io/kj187/charts/jarvis --version @CHART_VERSION@ --set image.tag=@VERSION@
          ```
          EOF
          else
            cat >> release-body.md <<'EOF'

          ## Helm chart

          ```shell
          helm install jarvis oci://ghcr.io/kj187/charts/jarvis --version @CHART_VERSION@
          ```

          Chart changes and breaking changes: [charts/jarvis/CHANGELOG.md](https://github.com/kj187/jarvis/blob/@TAG@/charts/jarvis/CHANGELOG.md)

          ### Verify chart signature (cosign)

          ```shell
          cosign verify ghcr.io/kj187/charts/jarvis:@CHART_VERSION@ \
            --certificate-identity-regexp="https://github.com/kj187/jarvis/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          ```
          EOF
          fi

          cat >> release-body.md <<'EOF'

          ## SBOM

          The SPDX SBOM is attached to this release (`sbom.spdx.json`) together with its keyless signature bundle (`sbom.spdx.json.sigstore.json`), and also embedded in the image manifest (`docker buildx imagetools inspect`).

          ```shell
          cosign verify-blob sbom.spdx.json \
            --bundle sbom.spdx.json.sigstore.json \
            --certificate-identity-regexp="https://github.com/kj187/jarvis/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          ```
          EOF

          sed -i "s|@VERSION@|${VERSION}|g; s|@DIGEST@|${DIGEST}|g; s|@CHART_VERSION@|${CHART_VERSION}|g; s|@TAG@|${GITHUB_REF_NAME}|g" release-body.md
          cat release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Releases are immutable: if one already exists for this tag, fail
          # instead of silently overwriting it (delete manually if intended).
          # Pre-release tags (contain a hyphen, e.g. v1.7.0-rc.1) are marked
          # --prerelease instead of --latest, so they never override the
          # "latest" pointer for the real release that follows.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            STABILITY_FLAG="--prerelease"
          else
            STABILITY_FLAG="--latest"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-body.md \
            --verify-tag \
            "${STABILITY_FLAG}" \
            sbom.spdx.json sbom.spdx.json.sigstore.json
