name: Chart Release

# Publishes the Helm chart when its version in Chart.yaml has not been
# published yet. Chart versioning is decoupled from the app version (see
# .agents/skills/release/SKILL.md). Published versions are immutable — the existence guard
# skips re-publishing instead of overwriting.
#
# Two entry points:
# - workflow_call from release.yml, AFTER the image is built, signed and
#   attested (require_image: true) — the path for every app release, so a
#   chart is never published pointing at an image that doesn't exist (yet).
# - push to main touching charts/** (and workflow_dispatch) — the chart-only
#   release path. It publishes only when the image for the chart's appVersion
#   already exists; a release PR merge (appVersion not built yet) skips here
#   and leaves publishing to the release workflow.

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      require_image:
        description: Fail (instead of skip) when the appVersion image does not exist.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless cosign signing via GitHub OIDC
    # The release PR merge (push) and the release workflow (workflow_call) can
    # overlap — serialize so both never race the existence guard.
    concurrency:
      group: chart-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # ratchet:azure/setup-helm@v5.0.1
        with:
          version: v3.21.0

      - name: Read chart version
        id: chart
        run: |
          VERSION=$(awk '/^version:/{print $2}' charts/jarvis/Chart.yaml)
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2}' charts/jarvis/Chart.yaml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION} (appVersion ${APP_VERSION})"

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR (Docker config, used by cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether version is already published
        id: guard
        run: |
          mkdir -p /tmp/chart-check
          if helm pull oci://ghcr.io/kj187/charts/jarvis \
               --version "${{ steps.chart.outputs.version }}" \
               --destination /tmp/chart-check 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Chart ${{ steps.chart.outputs.version }} already published — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the appVersion image exists
        id: image
        if: steps.guard.outputs.published == 'false'
        env:
          IMAGE: ghcr.io/kj187/jarvis:${{ steps.chart.outputs.app_version }}
          REQUIRE_IMAGE: ${{ inputs.require_image && 'true' || 'false' }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${REQUIRE_IMAGE}" = "true" ]; then
            echo "::error::${IMAGE} does not exist — refusing to publish a chart that points at it."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE} not built yet — skipping; the release workflow publishes this chart after the image."
          fi

      - name: Lint chart
        if: steps.guard.outputs.published == 'false' && steps.image.outputs.present == 'true'
        run: helm lint charts/jarvis/

      - name: Package and push chart
        if: steps.guard.outputs.published == 'false' && steps.image.outputs.present == 'true'
        id: push
        run: |
          VERSION="${{ steps.chart.outputs.version }}"
          helm package charts/jarvis --version "${VERSION}"
          helm push "jarvis-${VERSION}.tgz" oci://ghcr.io/kj187/charts 2>&1 | tee push.log
          DIGEST=$(awk '/^Digest:/{print $2}' push.log)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # ratchet:sigstore/cosign-installer@v4.1.2

      # Runs whenever the version exists in the registry (not only right after
      # a push) so a re-run or workflow_dispatch can heal a
      # published-but-unsigned version. Skipped when nothing was published.
      - name: Sign chart with keyless signing (GitHub OIDC)
        if: steps.guard.outputs.published == 'true' || steps.push.outcome == 'success'
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -n "${DIGEST}" ]; then
            REF="ghcr.io/kj187/charts/jarvis@${DIGEST}"
          else
            REF="ghcr.io/kj187/charts/jarvis:${{ steps.chart.outputs.version }}"
          fi
          if cosign verify "${REF}" \
               --certificate-identity-regexp="https://github.com/kj187/jarvis/.*" \
               --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
               >/dev/null 2>&1; then
            echo "${REF} is already signed — nothing to do."
          else
            cosign sign --yes "${REF}"
          fi
